<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockSense - New Adjustment</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: #111827;
            padding: 30px 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: white;
            margin-bottom: 45px;
            text-align: center;
        }

        .logo span {
            color: #4f8cff;
        }

        .menu a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 13px 15px;
            margin: 6px 0;
            border-radius: 8px;
            font-size: 16px;
        }

        .menu a:hover,
        .menu a.active {
            background: #2d3b55;
            color: white;
        }

        .main {
            margin-left: 230px;
            padding: 35px;
        }

        .topbar {
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 36px;
            color: #172033;
        }

        .topbar p {
            margin-top: 5px;
            color: #64748b;
            font-size: 18px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            max-width: 800px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce8;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .save {
            background: #4f8cff;
            color: white;
        }

        .save:hover {
            background: #3678ed;
        }

        .cancel {
            background: #e5e7eb;
            color: #374151;
        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            Stock<span>Sense</span>
        </div>

        <div class="menu">

            <a href="dashboard.html">
                🏠 Dashboard
            </a>

            <a href="products.html">
                📦 Products
            </a>

            <a href="receipts.html">
                📥 Receipts
            </a>

            <a href="deliveries.html">
                📤 Deliveries
            </a>

            <a href="transfers.html">
                🔄 Transfers
            </a>

            <a href="adjustments.html" class="active">
                📝 Adjustments
            </a>

            <a href="ledger.html">
                📊 Stock Ledger
            </a>

            <a href="warehouse.html">
                🏭 Warehouse
            </a>

        </div>

    </div>


    <!-- MAIN -->

    <div class="main">

        <div class="topbar">

            <h1>
                New Inventory Adjustment
            </h1>

            <p>
                Record the physical stock difference
            </p>

        </div>


        <div class="form-card">


            <!-- PRODUCT -->

            <div class="form-group">

                <label>
                    Product
                </label>

                <select id="product">

                    <option value="">
                        Select Product
                    </option>

                    <option value="Steel Rods">
                        Steel Rods
                    </option>

                    <option value="Office Chairs">
                        Office Chairs
                    </option>

                    <option value="Wooden Tables">
                        Wooden Tables
                    </option>

                </select>

            </div>


            <!-- STOCK VALUES -->

            <div class="form-row">


                <div class="form-group">

                    <label>
                        Recorded Stock
                    </label>

                    <input
                        type="number"
                        id="recordedStock"
                        placeholder="Enter recorded stock"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Physical Count
                    </label>

                    <input
                        type="number"
                        id="physicalCount"
                        placeholder="Enter physical count"
                    >

                </div>


            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label>
                    Location
                </label>

                <select id="location">

                    <option value="">
                        Select Location
                    </option>

                    <option value="Main Warehouse">
                        Main Warehouse
                    </option>

                    <option value="Warehouse 2">
                        Warehouse 2
                    </option>

                    <option value="Production Rack">
                        Production Rack
                    </option>

                </select>

            </div>


            <!-- NOTES -->

            <div class="form-group">

                <label>
                    Reason / Notes
                </label>

                <textarea
                    id="notes"
                    placeholder="Enter reason for adjustment..."
                ></textarea>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="button"
                    class="btn cancel"
                    onclick="window.location.href='adjustments.html'"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    class="btn save"
                    onclick="saveAdjustment()"
                >
                    Save Adjustment
                </button>

            </div>


        </div>

    </div>


    <!-- SAVE ADJUSTMENT JAVASCRIPT -->

    <script>

        function saveAdjustment() {

            const product =
                document.getElementById("product").value;

            const recordedStock =
                document.getElementById("recordedStock").value;

            const physicalCount =
                document.getElementById("physicalCount").value;

            const location =
                document.getElementById("location").value;

            const notes =
                document.getElementById("notes").value;


            // Check required fields

            if (
                !product ||
                !recordedStock ||
                !physicalCount ||
                !location
            ) {

                alert("Please fill all required fields.");

                return;

            }


            // Calculate difference

            const difference =
                Number(physicalCount) -
                Number(recordedStock);


            // Get existing adjustments

            let adjustments =
                JSON.parse(
                    localStorage.getItem("adjustments")
                ) || [];


            // Create adjustment number

            const newNumber =
                "ADJ-" +
                String(
                    adjustments.length + 4
                ).padStart(3, "0");


            // Create new adjustment

            const newAdjustment = {

                number: newNumber,

                product: product,

                recordedStock: recordedStock,

                physicalCount: physicalCount,

                difference: difference,

                location: location,

                notes: notes

            };


            // Add to array

            adjustments.push(newAdjustment);


            // Save to browser

            localStorage.setItem(
                "adjustments",
                JSON.stringify(adjustments)
            );


            // Return to adjustments page

            window.location.href =
                "adjustments.html";

        }

    </script>


</body>

</html>
